[workspace]
resolver = "2"
members = [
    "crates/vectordb-core",
    "crates/vectordb-server",
    "crates/vectordb-py",
    "crates/vectordb-cli",
]
# server and py added later

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rayon = "1"
memmap2 = "0.9"
crc32fast = "1"
bytemuck = { version = "1", features = ["derive"] }
redb = "2"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
criterion = "0.5"
tempfile = "3"